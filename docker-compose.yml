services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduquest
      POSTGRES_USER: eduquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - eduquest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduquest -d eduquest"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://eduquest:${POSTGRES_PASSWORD}@db:5432/eduquest
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD in .env}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      AI_TUTOR_MAX_TOKENS: ${AI_TUTOR_MAX_TOKENS:-1024}
      AI_TUTOR_TIMEOUT_MS: ${AI_TUTOR_TIMEOUT_MS:-30000}
      AI_TUTOR_DAILY_LIMIT: ${AI_TUTOR_DAILY_LIMIT:-20}
      ANTHROPIC_INPUT_USD_PER_MILLION: ${ANTHROPIC_INPUT_USD_PER_MILLION:-}
      ANTHROPIC_OUTPUT_USD_PER_MILLION: ${ANTHROPIC_OUTPUT_USD_PER_MILLION:-}
    ports:
      - "${APP_PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

volumes:
  eduquest-postgres:
